<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyLine Airlines — Vuelos</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .page-wrap { padding-top: 90px; }
    .products-hero {
      padding: 40px 48px 60px;
      background: linear-gradient(180deg, rgba(5,13,26,0.98) 0%, transparent 100%);
    }

    .filter-bar {
      display: flex; gap: 10px; flex-wrap: wrap; margin-top: 28px; align-items: center;
    }
    .filter-bar select {
      padding: 10px 16px; border-radius: 8px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      color: var(--white); font-family: var(--font-body); font-size: 0.88rem; outline: none;
      cursor: pointer;
    }
    .filter-bar select option { background: var(--navy2); }

    .products-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px; padding: 0 48px 80px; max-width: 1200px; margin: 0 auto;
    }

    /* Tarjeta de vuelo */
    .flight-card {
      background: rgba(15,32,64,0.7);
      border: 1px solid rgba(255,255,255,0.07); border-radius: 16px;
      overflow: hidden; transition: transform 0.25s, box-shadow 0.25s;
      display: flex; flex-direction: column;
    }
    .flight-card:hover { transform: translateY(-5px); box-shadow: 0 20px 50px rgba(0,0,0,0.3); }

    .flight-card-header {
      padding: 20px 24px 16px;
      background: linear-gradient(135deg, rgba(201,168,76,0.1), transparent);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      position: relative;
    }
    .flight-class {
      position: absolute; top: 16px; right: 16px;
      padding: 4px 10px; border-radius: 6px; font-size: 0.72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .class-economy  { background: rgba(74,179,232,0.15); color: var(--sky); border: 1px solid rgba(74,179,232,0.3); }
    .class-business { background: rgba(201,168,76,0.15); color: var(--gold); border: 1px solid rgba(201,168,76,0.3); }
    .class-first    { background: rgba(255,215,0,0.15); color: gold; border: 1px solid rgba(255,215,0,0.4); }

    .flight-route {
      display: flex; align-items: center; gap: 12px; margin-bottom: 8px;
    }
    .route-code { font-family: var(--font-display); font-size: 1.5rem; font-weight: 900; }
    .route-arrow { color: var(--gold); font-size: 1.1rem; flex: 1; text-align: center; }
    .flight-info { font-size: 0.8rem; color: var(--muted); }

    .flight-card-body { padding: 20px 24px; flex: 1; }
    .flight-details { display: flex; flex-direction: column; gap: 8px; }
    .flight-detail-row { display: flex; justify-content: space-between; align-items: center; }
    .detail-label { font-size: 0.78rem; color: var(--muted); font-weight: 500; }
    .detail-value { font-size: 0.88rem; font-weight: 600; }

    .flight-amenities { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .amenity {
      padding: 4px 10px; border-radius: 6px; font-size: 0.72rem;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      color: var(--muted);
    }

    .flight-card-footer {
      padding: 18px 24px;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex; align-items: center; justify-content: space-between;
    }
    .flight-price { font-family: var(--font-display); font-size: 1.6rem; font-weight: 900; color: var(--gold); }
    .flight-price small { font-size: 0.75rem; color: var(--muted); font-weight: 400; font-family: var(--font-body); display: block; margin-top: -4px; }

    /* Modal de pago */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000;
      display: flex; align-items: center; justify-content: center; padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--navy2); border: 1px solid rgba(201,168,76,0.25);
      border-radius: 20px; width: 100%; max-width: 480px; padding: 36px;
      transform: scale(0.95); transition: transform 0.3s;
    }
    .modal-overlay.open .modal { transform: scale(1); }

    .modal-title { font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 6px; }
    .modal-sub { color: var(--muted); font-size: 0.88rem; margin-bottom: 28px; }

    .modal-flight-summary {
      background: rgba(201,168,76,0.06); border: 1px solid rgba(201,168,76,0.2);
      border-radius: 12px; padding: 18px; margin-bottom: 24px;
    }
    .modal-route { font-family: var(--font-display); font-size: 1.3rem; margin-bottom: 4px; }
    .modal-details { color: var(--muted); font-size: 0.85rem; }
    .modal-price-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.08);
    }
    .modal-total { font-family: var(--font-display); font-size: 1.6rem; color: var(--gold); font-weight: 700; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .modal-footer { display: flex; gap: 12px; margin-top: 24px; }
    .modal-footer .btn { flex: 1; justify-content: center; }

    /* Estado de pago exitoso */
    .pay-success { text-align: center; padding: 20px 0; }
    .pay-success .check { font-size: 56px; margin-bottom: 16px; }
    .pay-success h3 { font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 8px; }
    .pay-success p { color: var(--muted); font-size: 0.9rem; }
    .confirm-code { font-family: monospace; font-size: 0.85rem; color: var(--gold); margin-top: 12px; }

    @media (max-width: 768px) {
      .products-hero { padding: 36px 20px 40px; }
      .products-grid { padding: 0 20px 60px; grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/home" class="nav-logo">
      <div class="nav-logo-icon">✈</div>
      <span>SkyLine Airlines</span>
    </a>
    <div class="nav-links">
      <a href="/home">🏠 <span>Inicio</span></a>
      <a href="/search">🗺️ <span>Búsqueda</span></a>
      <a href="/products" class="active">🎫 <span>Vuelos</span></a>
      <a href="/about">ℹ️ <span>Acerca de</span></a>
      <a href="/auth/logout" class="btn-logout">Salir</a>
    </div>
  </nav>

  <div class="page-wrap">
    <div class="products-hero">
      <div class="hero-badge" style="display:inline-flex;align-items:center;gap:8px;background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.3);padding:6px 16px;border-radius:100px;font-size:.8rem;color:var(--gold);margin-bottom:16px;font-weight:600">🎫 Vuelos disponibles</div>
      <div class="section-title">Elige tu <span class="gold">próximo destino</span></div>
      <div class="filter-bar">
        <select id="filter-class" onchange="filterFlights()">
          <option value="">Todas las clases</option>
          <option value="Económica">Económica</option>
          <option value="Business">Business</option>
          <option value="Primera Clase">Primera Clase</option>
        </select>
        <select id="filter-dest" onchange="filterFlights()">
          <option value="">Todos los destinos</option>
          <option value="MEX">Ciudad de México</option>
          <option value="LAX">Los Ángeles</option>
          <option value="CDG">París</option>
          <option value="JFK">Nueva York</option>
          <option value="NRT">Tokio</option>
        </select>
      </div>
    </div>

    <div class="products-grid" id="flights-grid">
      <!-- Generado por JS -->
    </div>
  </div>

  <!-- Modal de pago -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div id="modal-body"><!-- contenido dinámico --></div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    // ── Catálogo de vuelos (productos) ─────────────────────
    const flights = [
      {
        id: 'SKL-001',
        origin: 'CJS', originCity: 'Ciudad Juárez',
        dest: 'MEX', destCity: 'Ciudad de México',
        class: 'Económica', classKey: 'economy',
        date: '20 Ene 2025', time: '07:30 – 09:20', duration: '1h 50m',
        aircraft: 'Boeing 737 MAX', seats: 28,
        amenities: ['🍽️ Snack', '📱 WiFi', '🎧 Entretenimiento'],
        price: 2400
      },
      {
        id: 'SKL-002',
        origin: 'CJS', originCity: 'Ciudad Juárez',
        dest: 'LAX', destCity: 'Los Ángeles',
        class: 'Business', classKey: 'business',
        date: '22 Ene 2025', time: '10:00 – 11:45', duration: '1h 45m',
        aircraft: 'Airbus A320', seats: 12,
        amenities: ['🍷 Vino', '📱 WiFi', '🛏️ Asiento cama', '🎧 Noise cancel'],
        price: 8900
      },
      {
        id: 'SKL-003',
        origin: 'CJS', originCity: 'Ciudad Juárez',
        dest: 'CDG', destCity: 'París',
        class: 'Primera Clase', classKey: 'first',
        date: '25 Ene 2025', time: '13:15 – 08:30+1', duration: '13h 15m',
        aircraft: 'Boeing 787 Dreamliner', seats: 8,
        amenities: ['🥩 Menú gourmet', '🛏️ Cama completa', '🚿 Ducha a bordo', '🍾 Champagne', '📱 WiFi ilimitado'],
        price: 32500
      },
      {
        id: 'SKL-004',
        origin: 'CJS', originCity: 'Ciudad Juárez',
        dest: 'JFK', destCity: 'Nueva York',
        class: 'Económica', classKey: 'economy',
        date: '18 Ene 2025', time: '06:00 – 12:30', duration: '4h 30m',
        aircraft: 'Airbus A321neo', seats: 45,
        amenities: ['🍽️ Snack', '📱 WiFi'],
        price: 4200
      },
      {
        id: 'SKL-005',
        origin: 'CJS', originCity: 'Ciudad Juárez',
        dest: 'NRT', destCity: 'Tokio',
        class: 'Business', classKey: 'business',
        date: '30 Ene 2025', time: '16:00 – 19:30+1', duration: '15h 30m',
        aircraft: 'Boeing 777-300ER', seats: 14,
        amenities: ['🍱 Menú japonés', '🛏️ Asiento cama', '📱 WiFi', '🎮 Entretenimiento premium'],
        price: 24000
      },
      {
        id: 'SKL-006',
        origin: 'MEX', originCity: 'Ciudad de México',
        dest: 'CDG', destCity: 'París',
        class: 'Primera Clase', classKey: 'first',
        date: '28 Ene 2025', time: '22:00 – 17:45+1', duration: '11h 45m',
        aircraft: 'Airbus A380', seats: 6,
        amenities: ['🥩 Menú Michelin', '🛏️ Suite privada', '🚿 Ducha', '🍾 Champagne', '📱 WiFi', '🧖 Spa kit'],
        price: 58000
      }
    ];

    let selectedFlight = null;

    function renderFlights(list = flights) {
      const classMap = { 'economy': 'class-economy', 'business': 'class-business', 'first': 'class-first' };
      document.getElementById('flights-grid').innerHTML = list.map(f => `
        <div class="flight-card">
          <div class="flight-card-header">
            <span class="flight-class ${classMap[f.classKey]}">${f.class}</span>
            <div class="flight-route">
              <span class="route-code">${f.origin}</span>
              <span class="route-arrow">──✈──</span>
              <span class="route-code">${f.dest}</span>
            </div>
            <div class="flight-info">${f.originCity} → ${f.destCity}</div>
          </div>
          <div class="flight-card-body">
            <div class="flight-details">
              <div class="flight-detail-row"><span class="detail-label">📅 Fecha</span><span class="detail-value">${f.date}</span></div>
              <div class="flight-detail-row"><span class="detail-label">⏰ Horario</span><span class="detail-value">${f.time}</span></div>
              <div class="flight-detail-row"><span class="detail-label">⏱️ Duración</span><span class="detail-value">${f.duration}</span></div>
              <div class="flight-detail-row"><span class="detail-label">✈ Aeronave</span><span class="detail-value">${f.aircraft}</span></div>
              <div class="flight-detail-row"><span class="detail-label">💺 Asientos</span><span class="detail-value">${f.seats} disponibles</span></div>
            </div>
            <div class="flight-amenities">${f.amenities.map(a => `<span class="amenity">${a}</span>`).join('')}</div>
          </div>
          <div class="flight-card-footer">
            <div class="flight-price">$${f.price.toLocaleString('es-MX')}<small>MXN / persona</small></div>
            <button class="btn btn-primary" onclick="openPayment('${f.id}')">Reservar</button>
          </div>
        </div>
      `).join('');
    }

    function filterFlights() {
      const cls  = document.getElementById('filter-class').value;
      const dest = document.getElementById('filter-dest').value;
      renderFlights(flights.filter(f =>
        (!cls  || f.class === cls) &&
        (!dest || f.dest  === dest)
      ));
    }

    // ── Modal de pago ──────────────────────────────────────
    function openPayment(flightId) {
      selectedFlight = flights.find(f => f.id === flightId);
      const f = selectedFlight;
      document.getElementById('modal-body').innerHTML = `
        <div class="modal-title">Confirmar reserva</div>
        <div class="modal-sub">Revisa los datos antes de pagar</div>
        <div class="modal-flight-summary">
          <div class="modal-route">✈ ${f.origin} → ${f.dest}</div>
          <div class="modal-details">${f.class} · ${f.date} · ${f.time}</div>
          <div class="modal-price-row">
            <span class="muted" style="font-size:.85rem">Total a pagar:</span>
            <span class="modal-total">$${f.price.toLocaleString('es-MX')} MXN</span>
          </div>
        </div>
        <div class="form-group">
          <label>Nombre en la tarjeta</label>
          <input type="text" id="pay-name" placeholder="NOMBRE APELLIDO">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Número de tarjeta</label>
            <input type="text" id="pay-card" placeholder="4242 4242 4242 4242" maxlength="19" oninput="formatCard(this)">
          </div>
          <div class="form-group">
            <label>CVV</label>
            <input type="text" id="pay-cvv" placeholder="123" maxlength="3">
          </div>
        </div>
        <div class="form-group">
          <label>Fecha de vencimiento</label>
          <input type="text" id="pay-exp" placeholder="MM/AA" maxlength="5">
        </div>
        <div style="font-size:.75rem;color:var(--muted);margin-top:8px">
          🔒 Pago seguro simulado con Stripe Test. Usa tarjeta: 4242 4242 4242 4242
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-primary" onclick="processPayment()">Pagar $${f.price.toLocaleString('es-MX')} MXN</button>
        </div>
      `;
      document.getElementById('modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
    }

    function formatCard(input) {
      let v = input.value.replace(/\D/g, '').slice(0, 16);
      input.value = v.replace(/(.{4})/g, '$1 ').trim();
    }

    async function processPayment() {
      const name = document.getElementById('pay-name')?.value.trim();
      const card = document.getElementById('pay-card')?.value.trim();
      if (!name || !card) { toast('Completa los datos de pago', 'error'); return; }

      const f = selectedFlight;
      try {
        const r = await fetch('/api/pay', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ productId: f.id, productName: `${f.origin}→${f.dest} ${f.class}`, amount: f.price })
        });
        const d = await r.json();

        if (d.ok) {
          const code = 'SKL-' + Math.random().toString(36).substr(2, 8).toUpperCase();
          document.getElementById('modal-body').innerHTML = `
            <div class="pay-success">
              <div class="check">✅</div>
              <h3>¡Reserva confirmada!</h3>
              <p>Tu vuelo ${f.origin} → ${f.dest} ha sido reservado exitosamente</p>
              <p style="margin-top:8px">${f.class} · ${f.date} · ${f.time}</p>
              <div class="confirm-code">Código de reserva: ${code}</div>
              ${d.demo ? '<div style="margin-top:12px;font-size:.75rem;color:var(--muted)">Pago simulado — configura Stripe para pagos reales</div>' : ''}
              <button class="btn btn-primary" style="margin-top:24px;width:100%;justify-content:center" onclick="closeModal()">Cerrar</button>
            </div>
          `;
        } else {
          toast(d.msg || 'Error al procesar el pago', 'error');
        }
      } catch {
        toast('Error de conexión', 'error');
      }
    }

    // Cerrar modal al hacer clic fuera
    document.getElementById('modal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    function toast(msg, type = 'info') {
      const el = document.getElementById('toast');
      el.textContent = msg; el.className = `show ${type}`;
      setTimeout(() => { el.className = ''; }, 3500);
    }

    // Inicializar
    renderFlights();
  </script>
</body>
</html>
