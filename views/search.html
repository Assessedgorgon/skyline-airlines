<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyLine Airlines — Búsqueda</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    .page-wrap { display: flex; flex-direction: column; }
    .search-header {
      padding: 110px 48px 40px;
      background: linear-gradient(180deg, rgba(5,13,26,0.98) 0%, transparent 100%);
    }
    .search-header p { color: var(--muted); margin-top: 8px; }
    .search-body {
      flex: 1; display: grid;
      grid-template-columns: 340px 1fr;
      gap: 0; height: calc(100vh - 220px);
    }
    .side-panel {
      background: rgba(10,22,40,0.95);
      border-right: 1px solid rgba(255,255,255,0.07);
      overflow-y: auto; padding: 24px;
    }
    .side-panel::-webkit-scrollbar { width: 4px; }
    .side-panel::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.3); border-radius: 2px; }
    .search-input-wrap { position: relative; margin-bottom: 20px; }
    .search-input-wrap input {
      width: 100%; padding: 12px 16px 12px 42px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; color: var(--white);
      font-family: var(--font-body); font-size: 0.9rem; outline: none;
      transition: border-color 0.2s;
    }
    .search-input-wrap input:focus { border-color: var(--gold); }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .filter-btn {
      padding: 6px 14px; border-radius: 100px; border: 1px solid rgba(255,255,255,0.1);
      background: transparent; color: var(--muted); font-size: 0.78rem; font-weight: 500;
      cursor: pointer; transition: all 0.2s; font-family: var(--font-body);
    }
    .filter-btn.active, .filter-btn:hover {
      background: rgba(201,168,76,0.1); border-color: rgba(201,168,76,0.4); color: var(--gold);
    }
    .place-item {
      padding: 14px; border-radius: 10px; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.06); margin-bottom: 10px;
      transition: all 0.2s; background: rgba(255,255,255,0.02);
    }
    .place-item:hover { background: rgba(201,168,76,0.06); border-color: rgba(201,168,76,0.2); }
    .place-name { font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; }
    .place-type { color: var(--muted); font-size: 0.78rem; }
    .place-dist { color: var(--gold); font-size: 0.78rem; margin-top: 4px; }
    #map { flex: 1; z-index: 1; }
    .leaflet-container { background: #0a1628 !important; }
    .leaflet-popup-content-wrapper {
      background: #0f2040; color: #f5f0e8;
      border: 1px solid rgba(201,168,76,0.3); border-radius: 10px;
    }
    .leaflet-popup-tip { background: #0f2040; }
    .leaflet-popup-content h3 { color: #c9a84c; font-size: 0.95rem; margin-bottom: 4px; }
    .leaflet-popup-content p  { color: #7a8fa6; font-size: 0.8rem; margin: 0; }
    @media (max-width: 768px) {
      .search-header { padding: 100px 20px 24px; }
      .search-body { grid-template-columns: 1fr; height: auto; }
      .side-panel { height: 320px; }
      #map { height: 400px; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/home" class="nav-logo">
      <div class="nav-logo-icon">✈</div>
      <span>SkyLine Airlines</span>
    </a>
    <div class="nav-links">
      <a href="/home">🏠 <span>Inicio</span></a>
      <a href="/search" class="active">🗺️ <span>Búsqueda</span></a>
      <a href="/products">🎫 <span>Vuelos</span></a>
      <a href="/about">ℹ️ <span>Acerca de</span></a>
      <a href="/auth/logout" class="btn-logout">Salir</a>
    </div>
  </nav>

  <div class="page-wrap">
    <div class="search-header">
      <div class="section-title">Explora <span class="gold">destinos</span></div>
      <p>Ubica aeropuertos, hoteles y atracciones cercanas a ti</p>
    </div>
    <div class="search-body">
      <div class="side-panel">
        <div class="search-input-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="place-search" placeholder="Buscar lugar..." oninput="filterPlaces(this.value)">
        </div>
        <div class="filters">
          <button class="filter-btn active" onclick="setFilter(this,'')">Todos</button>
          <button class="filter-btn" onclick="setFilter(this,'airport')">✈ Aeropuertos</button>
          <button class="filter-btn" onclick="setFilter(this,'hotel')">🏨 Hoteles</button>
          <button class="filter-btn" onclick="setFilter(this,'restaurant')">🍽️ Restaurantes</button>
        </div>
        <div id="places-list">
          <div class="muted" style="font-size:.85rem;text-align:center;padding:20px">
            <div class="spinner" style="margin-bottom:12px"></div>
            Buscando lugares cercanos...
          </div>
        </div>
      </div>
      <div id="map"></div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const demoPlaces = [
      { name: 'Aeropuerto Internacional de Ciudad Juárez', type: 'airport', emoji: '✈️', lat: 31.6363, lng: -106.4287, dist: '8.2 km' },
      { name: 'Aeropuerto El Paso International', type: 'airport', emoji: '✈️', lat: 31.8072, lng: -106.3779, dist: '12.5 km' },
      { name: 'Hotel Lucerna Ciudad Juárez', type: 'hotel', emoji: '🏨', lat: 31.6789, lng: -106.4312, dist: '1.4 km' },
      { name: 'Hotel Camino Real Juárez', type: 'hotel', emoji: '🏨', lat: 31.7201, lng: -106.4518, dist: '3.8 km' },
      { name: 'La Fogata Restaurant', type: 'restaurant', emoji: '🍽️', lat: 31.6912, lng: -106.4234, dist: '0.7 km' },
      { name: "Applebee's Juárez", type: 'restaurant', emoji: '🍽️', lat: 31.6955, lng: -106.4198, dist: '1.1 km' },
      { name: 'Plaza Las Misiones', type: 'shopping_mall', emoji: '🛍️', lat: 31.6845, lng: -106.4401, dist: '2.3 km' },
    ];

    let activeFilter = '';
    let map, markers = [];

    function initMap(lat, lng) {
      map = L.map('map').setView([lat, lng], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a>',
        maxZoom: 19
      }).addTo(map);

      // Marcador usuario
      const userIcon = L.divIcon({
        html: '<div style="width:16px;height:16px;background:#c9a84c;border:3px solid #fff;border-radius:50%;box-shadow:0 0 8px rgba(201,168,76,0.8)"></div>',
        iconSize: [16,16], iconAnchor: [8,8], className: ''
      });
      L.marker([lat, lng], { icon: userIcon }).addTo(map).bindPopup('<h3>📍 Tu ubicación</h3>');

      // Marcadores de lugares
      demoPlaces.forEach((p, i) => {
        const icon = L.divIcon({
          html: '<div style="font-size:22px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5))">' + p.emoji + '</div>',
          iconSize: [28,28], iconAnchor: [14,14], className: ''
        });
        markers[i] = L.marker([p.lat, p.lng], { icon })
          .addTo(map)
          .bindPopup('<h3>' + p.emoji + ' ' + p.name + '</h3><p>' + p.type + (p.dist ? ' · ' + p.dist : '') + '</p>');
      });

      renderList(demoPlaces);
    }

    function renderList(places) {
      const el = document.getElementById('places-list');
      if (!places.length) { el.innerHTML = '<div class="muted" style="text-align:center;padding:20px">Sin resultados</div>'; return; }
      el.innerHTML = places.map(p => {
        const i = demoPlaces.indexOf(p);
        return '<div class="place-item" onclick="focusPlace(' + i + ')">' +
          '<div class="place-name">' + p.emoji + ' ' + p.name + '</div>' +
          '<div class="place-type">' + p.type + '</div>' +
          (p.dist ? '<div class="place-dist">📍 ' + p.dist + '</div>' : '') +
          '</div>';
      }).join('');
    }

    function focusPlace(i) {
      if (map && markers[i]) {
        map.setView([demoPlaces[i].lat, demoPlaces[i].lng], 15);
        markers[i].openPopup();
      }
    }

    function setFilter(btn, type) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = type;
      applyFilters();
    }

    function filterPlaces(q) { applyFilters(q); }

    function applyFilters(q) {
      q = q !== undefined ? q : document.getElementById('place-search').value;
      let filtered = demoPlaces;
      if (activeFilter) filtered = filtered.filter(p => p.type === activeFilter);
      if (q) filtered = filtered.filter(p => p.name.toLowerCase().includes(q.toLowerCase()));
      renderList(filtered);
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => initMap(pos.coords.latitude, pos.coords.longitude),
        ()  => initMap(31.6904, -106.4245)
      );
    } else {
      initMap(31.6904, -106.4245);
    }
  </script>
</body>
</html>
